name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build arm64
        run: swift build -c release --arch arm64

      - name: Build x86_64
        run: swift build -c release --arch x86_64

      - name: Create universal binary
        run: |
          lipo -create \
            .build/arm64-apple-macosx/release/mabs13-plugin-update \
            .build/x86_64-apple-macosx/release/mabs13-plugin-update \
            -output mabs13-plugin-update
          chmod +x mabs13-plugin-update

      - name: Package binary
        run: |
          zip mabs13-plugin-update-${{ github.ref_name }}-macos.zip mabs13-plugin-update
          shasum -a 256 mabs13-plugin-update-${{ github.ref_name }}-macos.zip > mabs13-plugin-update-${{ github.ref_name }}-macos.zip.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            mabs13-plugin-update-${{ github.ref_name }}-macos.zip \
            mabs13-plugin-update-${{ github.ref_name }}-macos.zip.sha256 \
            --title "mabs13-plugin-update ${{ github.ref_name }}" \
            --generate-notes
